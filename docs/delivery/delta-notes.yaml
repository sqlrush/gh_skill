# 增量导入包里每条脚本的说明 —— tools/delivery_delta.py 读这份。
#
# **为什么说明要单独维护、而增量清单不要手写。** 2026-10-18 第一次出增量包时,
# 新增/变更清单是手写的 —— 结果漏了 4 条正文变更(wdr.file_io 等),而 file_io 那条
# 修的是物理读少报 62%、写得最多的文件整个不在报告里。清单现在由工具对比客户在用的
# 那一版**自动算**;这份文件只负责「为什么」。工具发现某条新增/变更在这里没有说明,
# 会直接报错退出 —— 不许静默地出一个缺条目的包。
#
# added: 新增脚本 → [标题, 读取什么, 用途]
# changed: 已有脚本的正文变更 → 一段说明(给客户的变更评审看)

added:
  sqltune.stat_now:
    - 单条 SQL 的现状(执行次数与耗时)
    - dbe_perf.statement
    - SQL 优化回答的第一段:这条语句自统计清零以来执行了多少次、平均 / 最大 / 最小耗时、CPU 与数据 IO 时间。按 unique_sql_id 只取一条语句,只读
  sqltune.stat_trend:
    - 单条 SQL 的按小时趋势
    - snapshot.snap_summary_statement / snapshot.snapshot
    - 取近 7 天每个 WDR 快照时刻这条语句的累计值,脚本相减得到每小时的次数与平均耗时,判断是否在某个时间段突然变慢。只读
  sqltune.exec_history:
    - 单条 SQL 每小时最慢多少、执行计划变没变
    - dbe_perf.statement_history
    - 按小时归并这条语句被记下的执行,给出平均 / 最大耗时与执行计划指纹;计划只在变化时给出全文,用来判断突然变慢时计划有没有变。只读
  vacuum.freeze_age:
    - 事务号冻结水位
    - pg_database.datfrozenxid64 / pg_settings
    - 冻结水位接近 autovacuum_freeze_max_age 时，autovacuum 会对大表触发不择时的全表冻结扫描（IO 风暴）；水位不推进则 clog/csnlog 无法截断、持续占盘
  health.storage:
    - 库与表空间占用量
    - pg_database / pg_tablespace
    - 定位哪个库或表空间在增长。注：本内核取不到文件系统剩余空间，只能看占用量
  health.sync_commit:
    - 同步提交配置与部署形态
    - pg_settings / pg_is_in_recovery()
    - 集群要求同步确认却没有可用同步备时，主库提交会一直等待、写入全部挂住。先判断单机/集群，避免在单机库上误报
  health.wal_slots:
    - 复制槽落后的 WAL 字节数
    - pg_replication_slots
    - 槽不消费时 WAL 只增不减直到填满磁盘；未活跃的槽尤其危险，没有任何机制会自动清理
  health.thread_pool:
    - 线程池用量
    - pg_settings / pg_stat_activity
    - 开启线程池后真正的并发上限是池大小而非 max_connections；池满后新请求排队，表现为「库无响应」而连接数看着仍有余量
  health.partitions:
    - 分区表的分区数量与策略
    - pg_partition / pg_class
    - 分区数达到四位数时每次查询规划都要遍历分区元数据，规划开销明显上升
  vacuum.bloat_estimate:
    - 表膨胀估算的输入
    - pg_class / pg_stats
    - 死元组比例回答「有多少可回收」，这条回答「空间比应占多了多少」——后者 VACUUM 不还盘，需要评估重建
  config.settings:
    - 全量运行参数
    - pg_settings
    - 参数体检：检查参数自相矛盾、会静默丢数据的危险配置、按实例内存预算算出的超卖

  health.snap_counters:
    - 某个 WDR 快照时刻的库级累计计数器
    - snapshot.snap_global_instance_time / snap_summary_stat_database / snap_global_bgwriter_stat
    - 时段体检：用户问「某个时间段库怎么样」时，取包住这段时间的两个快照相减，得到这段时间的 DB time、提交 / 回滚 / 死锁、临时溢出、缓存命中、检查点
  health.live_counters:
    - 此刻的库级累计计数器与数据库时钟
    - dbe_perf.global_instance_time / pg_stat_database / pg_stat_bgwriter / pg_postmaster_start_time()
    - 时段体检「到此刻」的那一端；同时给出数据库的当前时间、实例启动与统计重置时刻，用来判断窗口有没有跨过重启（跨过重启的两端不能相减）
  health.snap_waits:
    - 某个 WDR 快照时刻的等待事件累计值
    - snapshot.snap_global_wait_events
    - 时段体检的等待分布（按等待类与事件）；已剔除 STATUS / NONE 这类空闲等待（会话在等客户端发下一条命令）
  health.live_waits:
    - 此刻的等待事件累计值
    - dbe_perf.global_wait_events
    - 时段体检「到此刻」那一端的等待分布；同样剔除空闲等待
  topsql.snap_statement:
    - 某个 WDR 快照时刻的语句累计值（按 sql_id 聚合）
    - snapshot.snap_summary_statement
    - 时段 Top SQL：用户问「某个时间段 / 最近 N 分钟哪些 SQL 最耗时」时，两个快照（或快照与此刻）相减得到这段时间内每条语句的调用次数与耗时
  lockwait.asp_status:
    - 活跃会话采样（ASP）的开关与时段内样本数
    - pg_settings / gs_asp
    - 时段锁回溯的前提检查：采样没开、过了保留期、还没落表时如实说明「回看不了」，不和「没有锁等待」混为一谈
  lockwait.asp_pairs:
    - 时段内的锁阻塞对（谁等谁、等什么锁、锁在哪张表、采到几次）
    - gs_asp（活跃会话采样）/ pg_class / pg_namespace / pg_database
    - 事后回看某段时间谁挡了谁：锁视图只有此刻，SQL 历史只记锁等待总时长；采样每个样本记着当时在等哪个会话
  lockwait.asp_sessions:
    - 时段锁回溯涉及的会话（最后状态、应用、客户端、事务开始时间）
    - gs_asp（活跃会话采样）
    - 找出阻塞链的根并判断是不是「事务开着不干活」的空闲事务持锁
  explain.plan_from_history:
    - SQL 历史里最近一次真实执行计划
    - dbe_perf.statement_history（query_plan 列）
    - 语句文本是归一化的（带占位符）时 EXPLAIN 不了，改给当时真实执行的计划（带实际耗时与行数），并标明是哪次执行
  wdr.plan_in_window:
    - WDR 窗口内某条语句的真实执行计划
    - dbe_perf.statement_history（query_plan 列）
    - WDR 报告 SQL 附录直接附上这段时间执行时的真实计划，不再写「执行计划：本次未取到」
  procinfo.source_adm:
    - 存储过程源码(ADM_SOURCE 兜底)
    - pg_catalog.adm_source
    - 按名字逐行取过程 / 函数 / 包体的定义。只在按 pg_proc 取不到时调用(开了对象隔离的库,普通账号查 pg_proc 受行级访问控制);需执行账号有 ADM_SOURCE 的读权限,没有权限时技能照常给出排查报告。只读
  proctune.source_adm:
    - 存储过程源码(ADM_SOURCE 兜底)
    - pg_catalog.adm_source
    - 与 procinfo.source_adm 相同,供存储过程调优在 pg_proc 取不到源码时使用。只读

changed:
  topsql.top_sql: >-
    **只加列**：只读 dbe_perf.statement，输出新增 CPU 与数据 IO 耗时两列（cpu_sec / io_sec），
    用于区分「等锁 / 排队的语句」和「自身慢的语句」——实测窗口里两张榜的榜首都是被锁挡住的语句，
    真正自身慢的排在后面。筛选条件、原有列和排序参数都不变。
  wdr.snapshots: >-
    **精度修正**：快照开始 / 结束时间从「到分钟」改为「到秒」。时段体检与时段 Top SQL 要按用户给的
    时间挑快照，到分钟时同一分钟内的两个快照分不出先后。原有调用方只取前 16 位，不受影响。
  wdr.top_sql: >-
    **修正取数错误**：原 SQL 用 `FROM e JOIN b USING (sid)` 内连接，窗口内**新出现**的语句
    （起始快照里没有它）会被整批丢掉。实测一个 20 分钟窗口里 147 条语句只保留了 55 条，
    导致 DB time 少报约 8800 倍（报 2.67 秒，实际 23518 秒）。改为 LEFT JOIN + COALESCE。
  wdr.file_io: >-
    **修正取数错误**（与 wdr.top_sql 同一问题）：内连接丢掉窗口内新出现的文件。
    实测一个 20 分钟窗口里 1468 个文件只统计了 185 个，物理读少报 62%、物理写少报 58%；
    被丢掉的文件里最大的一个物理写 569,700 次，比内连接下整个窗口的写入总量还大 ——
    写得最多的文件在报告里完全不存在。改为 LEFT JOIN + COALESCE。
  wdr.cache: >-
    **修正取数错误**（同一问题，预防性）：内连接会丢掉窗口内新建的表。
    实测窗口里两端对称、未丢行，但结构上与 wdr.file_io 相同，窗口内真新建表时会静默少算。
    改为 LEFT JOIN + COALESCE。
  wdr.db_stat: >-
    **修正取数错误**（同一问题，预防性）：内连接会丢掉窗口内新建的库。改为 LEFT JOIN + COALESCE。
  wdr.db_summary: >-
    **修正取数错误**（同一问题，预防性）：内连接会丢掉窗口内新建的库。改为 LEFT JOIN + COALESCE。
  sqltune.plan_text_analyze: >-
    **修正拼写错误**：`BUFFERS fasle` → `BUFFERS false`。`fasle` 不是合法布尔值，该脚本执行会直接报错。
  proctune.plan_text_analyze: >-
    **修正拼写错误**：同上（`BUFFERS fasle` → `BUFFERS false`）。
  health.long_xact: >-
    **修正漏报**：「客户端会话」的认法由 connection_info 非空改为 client_port 非空。connection_info
    只有 openGauss 自带的 libpq 会填，psycopg2 这类客户端是空串，原条件把它们的长事务、空闲事务整类漏掉；
    内核后台线程的 client_port 都是空，照样排除。另排除执行本查询的会话自身，多返回一列 waiting
    （是否在等锁，供「执行中的长 SQL」区分等锁的语句）。只读。
  health.overview: >-
    **修正漏报与计数**：「最老事务」子查询认客户端会话的条件改法同 health.long_xact；连接数改数
    pg_stat_activity 里 sessionid <> 0 的条目（原 sum(numbackends) 把线程池空闲工作线程也算进去，
    与 health.conn_states 同一口径）。输出列不变。只读。
  health.conn_concentration: >-
    **修正漏报**：活跃连接集中度认客户端会话的条件改法同 health.long_xact，其余不变。只读。
  health.conn_states: >-
    **修正计数**：只数 sessionid <> 0 的会话。开了线程池时有一批空闲工作线程的条目（无客户端、不持锁），
    原 SQL 把它们算进总数与 idle（实测 61 个真实会话报成 65）。与 health.thread_pool 同一口径。只读。
  health.stale_stats: >-
    **修正漏报**：从没 ANALYZE 过的表 reltuples 与 relpages 都是 0，原门槛与排序把它们截掉了——
    恰恰是统计信息最该更新的那批。新增参数 min_pages（默认 128 页），候选门槛加上按文件大小算的实时页数；
    排序改为未分析的在前 → 页数偏离比例 → 体积。只读，判定规则不变。
  vacuum.oldest_xmin: >-
    **修正漏报**：长事务分支认客户端会话的条件改法同 health.long_xact，卡住回收水位的
    psycopg2 等客户端事务不再漏掉。只读。
  lockwait.asp_status: >-
    **补充覆盖范围**：时段锁回溯原来只数落表（gs_asp）的样本；最近几小时的活跃会话样本只在内存视图
    dbe_perf.local_active_session 里，内存写满才按比例落表。多查 asp_flush_mode、asp_sample_num 两个参数
    与内存样本的数量和起止时间，用来如实说明能回看到哪一段。只读。
  lockwait.asp_pairs: >-
    **修正回看不了**：样本来源由 gs_asp 改为 gs_asp ∪ dbe_perf.local_active_session（内存侧只取将来会落表的
    那批、且晚于最后一条落表样本，不重复计数），输出列不变。原来最近几小时的锁等待一律「回看不了」。只读。
  lockwait.asp_sessions: >-
    **修正回看不了**：样本来源改法同 lockwait.asp_pairs，输出列不变。只读。
  memanalyze.gucs: >-
    **修正误报**：pg_settings 的参数清单补上 enable_resource_record。history 子命令要靠它判断 WLM 历史表
    能不能用，原清单漏了它，读不到被当成 off，报告误写「参数没开」。只读。
  topsql.snap_statement: >-
    **只加列**：只读 snapshot.snap_summary_statement，输出新增 CPU 与数据 IO 耗时两列，
    供时间段 Top SQL 计算等待占比；筛选与排序不变。
