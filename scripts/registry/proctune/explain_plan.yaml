# 原来内联在 evidence.py 的 explain() 里：
#   f"EXPLAIN (ANALYZE {a}, BUFFERS {a}, FORMAT TEXT) {sql_text}"
# 白名单模型下任何 SQL 都得先注册，没有例外。
#
# {{analyze}} 是 Boolean：协议把它按 true/false 原样贴进 SQL，
# 与原来 str(analyze).lower() 渲染出的文本逐字相同。
#
# {{sql}} 是整条待解释的语句直通，静态判不出它是不是只读，所以显式
# readonly: true —— 作者担保只读（调用方只把已筛过的游标 SELECT 传进来），
# 会话仍钉在只读上，真有写操作会被数据库挡回。
#
# 注：结果列名由数据库给定（QUERY PLAN），EXPLAIN 不支持起别名。
# 用 FORMAT TEXT 而不是 FORMAT JSON 是有原因的：JSON 列会被驱动解成
# Python 对象，协议再 str() 一遍就成了 Python repr（单引号），
# json.loads 解不回来。需要 cost 数字的 explain_cost 因此留在直连会话里。
name: proctune.explain_plan
description: 对给定语句取执行计划（TEXT 格式）
readonly: true
sql: |
  EXPLAIN (ANALYZE {{analyze}}, BUFFERS {{analyze}}, FORMAT TEXT) {{sql}}
params:
  - key: analyze
    type: Boolean
    description: 是否真实执行以取得实际行数/耗时。proctune 一律传 false
  - key: sql
    type: String
    description: 待解释的语句正文。取值来自过程源码中已判定为只读的游标 SELECT
