# 运行态计划:gs_get_explain(pid)——GaussDB 私有函数,返回指定后台线程**正在执行**的计划。
#
# 与 explain.plan_text 的本质差别:不执行任何 SQL、不需要 SQL 文本,拿到的是内核里正在走的那个计划
# (估算计划可能因绑定值 / 统计信息 / 计划跳变而与之不同)。
#
# **`::integer` 是刻意写死的。** 官方签名 gs_get_explain(integer);2026-09-06 现场脚本传了 bigint,
# int8 → int4 没有隐式转换,报 function gs_get_explain(bigint) does not exist。这里显式转型。
#
# **但 pid 本身可能就放不进 integer。** openGauss / GaussDB 的 pg_stat_activity.pid 是 64 位线程号
# (og5 实测 281440978523808),超出 integer 范围时 ::integer 会报 integer out of range。所以调用侧
# (common/kernel_funcs.py)在**打库之前**检查范围与探测到的签名,超范围就不调、直接说明原因并退回
# EXPLAIN——这一层关系正是现场那条报错的成因,写进提示里比让它在库里炸有用。
#
# 文档前提(任一不满足则返回空,调用方要把空当「没拿到」而不是「计划为空」):
#   track_activities = on;plan_collect_thresh ≠ -1;语句可 EXPLAIN 且计划不含 STREAM 算子;
#   分布式下只看 CN 生成的计划,DN 上的用 gs_get_dn_explain。
# 只在 explain.kernel_funcs 探到该函数存在时调用;openGauss 上没有此函数,不会走到这条。
name: explain.runtime_plan
description: 按后台线程 pid 取运行态执行计划(gs_get_explain,GaussDB 私有;不执行 SQL)
readonly: true
sql: |
  SELECT gs_get_explain({{pid}}::integer) AS plan;
params:
  - key: pid
    type: INTEGER
    description: 后台线程 pid(pg_stat_activity.pid);脚本内显式转为 integer
