# SQL 取自 common/sql.py 的 skill_health_006。列名齐全。
#
# 注意 LIKE '%lwlock%' 里的 % ：原来走绑定变量（pg8000 的 format 风格）时，
# 字面量 % 与占位符 %s 同处一串，是个隐患。迁到文本替换后没有绑定变量，
# % 一律是字面量，这个隐患随之消失。
name: health.lwlock
description: 轻量锁等待事件分布
sql: |
  SELECT COALESCE(wait_event,'<lwlock>') AS evt, count(*) AS cnt
  FROM pg_thread_wait_status
  WHERE lower(wait_status) LIKE '%lwlock%'
  GROUP BY wait_event
  ORDER BY cnt DESC
  LIMIT {{limit}};
params:
  - key: limit
    type: INTEGER
    description: 返回条数上限
