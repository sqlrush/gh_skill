# SQL 正文取自 common/sql.py 的 skill_topsql_001，f-string 的 {x} 换成 {{x}}，
# 其余逐字未动 —— 两条路径必须跑同一条 SQL。
#
# {{order}} 落在 ORDER BY 位，注册时会被标 IDENT_POSITION + STRING_PARAM：
# 标识符位无法做类型校验。防线在调用方 —— topsql.py 的 _SORT_COLS 白名单，
# 取值只能来自那张映射表，绝不直接来自用户输入。
name: topsql.top_sql
description: 资源消耗最高的语句（dbe_perf.statement）
sql: |
  SELECT
    unique_sql_id::text,
    LEFT(REGEXP_REPLACE(query, '\s+', ' ', 'g'), 80) AS query,
    n_calls AS calls,
    ROUND(total_elapse_time/1000000::numeric, 2) AS total_sec,
    ROUND((total_elapse_time/NULLIF(n_calls,0))/1000::numeric, 2) AS avg_ms,
    n_returned_rows AS rows
  FROM dbe_perf.statement
  WHERE n_calls > 0
  ORDER BY {{order}}
  LIMIT {{limit}};
params:
  - key: order
    type: String
    description: 排序表达式。必须来自调用方的受控白名单，不可直接取用户输入
  - key: limit
    type: INTEGER
    description: 返回条数上限
