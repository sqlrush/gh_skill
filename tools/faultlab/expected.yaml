# ----------------------------------------------------------------- 跨场景
cross_cutting:
  - 项: Top SQL 两张榜不该相同
    说明: 总耗时榜首应是 S7(高频),平均耗时榜首应是 S3/S4(单次慢)
    actual: "2026-10-24 第二轮(修复后,15:38:04–15:58:04,快照 3185–3190):按自身耗时的两张榜分开了,而且都对了:--by self 榜首是 S7(CPU+IO 585.7 秒、8698 次),--by self_avg 榜首是 S3(551 秒)、第二是 S4。按总耗时的 --by time / --by avg 榜首仍是等锁语句(K1 链的 UPDATE),以及被 faultlab 取消、进了执行历史的 S1/S2;但表下点名「80% 以上不是 CPU / 数据 IO,是被挡住的,不是自己慢」,并引导去看 lockwait。WDR 的「各维度元凶」:CPU 冠军是 S7,溢出冠军是 S6。"
  - 项: 四种「回收水位被卡」的来源要分得清
    说明: V2 长事务 / V3 两阶段事务 / V4 复制槽,三者的建议完全不同;只报「有死元组」等于没说
    actual: "2026-10-24 第二轮(修复后,15:38:04–15:58:04,快照 3185–3190):这次分清了。vacuum 的 R4 来源同时列出:复制槽 fl_slot_v4(年龄未知、照样在挡)、长事务(V2 的 idle in transaction SELECT count(*) FROM fl.xmin_hold,以及 K1 链上的会话)、两阶段事务 fl_xmin_v3 和 fl_orphan_k10(带 gid 与 owner)。三类来源各自成行,措辞不同。不足:两阶段事务没给 ROLLBACK PREPARED 的具体做法,复制槽也没给「删槽或让消费端跟上」的具体做法。"
  - 项: autovacuum「关了」与「限速到追不上」要分得清
    说明: V1 vs V5 —— 后者 last_autovacuum 一直在更新,只看开关会判成正常
    actual: "2026-10-24 第二轮(修复后,15:38:04–15:58:04,快照 3185–3190):「开关」这一面分清了:bloat_hot 一直报 R2 VACUUM_DISABLED,bloat_slow 从没报 R2,只报 R3 + R4。「限速」这一面仍没认出:bloat_slow 的 reloptions 里有 autovacuum_vacuum_cost_delay=20、cost_limit=60,vacuum 只字未提,建议也没指向 cost_delay / cost_limit。全量混跑时 V5 的 autovacuum 一轮也没跑完(worker 被占满),「last_autovacuum 一直在更新」这个陷阱这次也没造出来。"
  - 项: 线程池的空闲条目不该被算成会话
    说明: >
      og5 开了线程池,pg_stat_activity 里会有 sessionid=0、无客户端、不持锁的空闲线程条目
      (本工具在 db.REAL_SESSION 里专门过滤)。如果 skill 把它们算进「连接数 / 活跃会话数」,
      会虚高一截 —— 这是跑这套东西时顺带要核对的一点。
    actual: "2026-10-24 第二轮(修复后,15:38:04–15:58:04,快照 3185–3190):改好了一半。直接查库:15:56:30 pg_stat_activity 共 53 行,其中真会话 51、线程池空闲条目 2。health 的 Connections 维度写「共 51:active 34、idle 13、IIT 4」,与真会话一致,不再算空闲条目;线程池用量 50/800 也对。但 Overview 的「连接 53/1000」还是按全部行数算的,多了这 2 条。health.overview 的连接数也要加 sessionid<>0。"
