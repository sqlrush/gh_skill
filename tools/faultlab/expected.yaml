# 预期发现矩阵:每个场景 → 库里能看到什么 → 哪个 skill 应该报什么。
#
# **这张表是这套东西的目的所在。** 造故障本身只是手段;真正要回答的是
# 「这套诊断 skill 面对已知的故障,报不报、报得对不对」。所以每一项都写明:
#   signals  —— 不靠 skill、直接查库就能看到的事实(复核用,也是 probe 的依据)
#   expect   —— 哪个 skill、应该出现哪个判定码 / 哪句话
#   actual   —— **第一次全量跑完后由人填**:实际报了什么。没报出来的就是测试发现。
#               空串 = 还没填;填一段文字(没报也写明「未报」),不写成列表。
#
# 填完跑 `faultlab.py expected`:YAML 读不读得通、每项有没有 actual、编号与 lab/config.py 的排期表
# 是否一一对应,以及还剩哪几项没填。**以 * & ! 等符号开头的值要加引号**,否则整份文件解析不了
# (S7 那一行原先就是这样,一直没人发现)。
#
# expect 里的判定码取自各 skill 脚本里的常量(2026-10-17 从代码里核对过):
#   health    XACT_IDLE XACT_LONG PREPARED_XACT DEADLOCKS STALE_STATS SLOWSQL_TOP
#             SLOWSQL_LOW_CPU ROLLBACK_HIGH ACTIVE_HIGH ACTIVE_SQL_HOT CONN_HIGH
#             CKPT_PRESSURE CACHE_LOW INDEX_INVALID INDEX_UNUSED
#   lockwait  LOCK_WAIT LOCK_WAIT_LONG LOCK_BLOCKED LOCK_ROOT_IDLE_XACT LOCK_DEADLOCK
#   vacuum    VACUUM_OVERDUE(R1) VACUUM_DISABLED(R2) VACUUM_DEAD_RATIO(R3) VACUUM_XMIN_BLOCKED(R4)
#   waitevent WAIT_LOCK_HEAVY WAIT_LWLOCK_HEAVY DBTIME_CPU_HEAVY DBTIME_IO_HEAVY
#             LOCK_EVENT LWLOCK_EVENT
#   memanalyze MEM_SQL_SPILL MEM_OP_SPILL MEM_SQL_ESTIMATE_OFF MEM_SESSION_IDLE_XACT
#
# **一个重要提醒(写给填 actual 的人):** 「skill 没报」有两种可能 —— 它漏报,
# 或者故障根本没造出来。填之前先看 signals 那一列是否成立(用 `faultlab.py status` 复核)。

meta:
  window_s: 1200
  note: 全部场景共用一个 20 分钟窗口;轻量锁五段与 WDR 快照边界对齐(0/240/480/720/960/1200 秒)

scenarios:

  # ----------------------------------------------------------------- 慢 SQL
  - code: S1
    title: 相关子查询逐行执行(7 表,payments.order_id 无索引)
    signals: pg_stat_activity 里 fl:S1/q 一直 active,query_start 距今十几分钟
    expect:
      - health: 应报有长时间执行中的 SQL(ACTIVE_SQL_HOT / 慢 SQL 维度)
      - slowsql: 执行历史里**不该**有它 —— 它一次都没跑完;只会出现在「正在执行」里
      - sqltune: 给出的根因应落在「相关子查询 + 内层无索引」,建议建 payments(order_id) 索引
      - explain: 计划里应出现 SubPlan + Seq Scan on payments
    actual: "2026-10-24 第二轮(修复后,15:38:04–15:58:04,快照 3185–3190):故障已造出,fl:S1/q 整个窗口一直在跑。health 报对了:SLOWSQL_RUNNING「pid … 执行中的 SQL 407s >5m0s」(15:45 那次巡检,标题写明 dbe_perf.statement 只记已完成的执行);Overview 的最老事务也有值了(412s)。explain --pid 报对了:SubPlan 1/2 + Seq Scan on payments(Filter: order_id = orders.id)。sqltune(--sql-stdin)报对了:根因规则 correlated_subplan 点中,并写明「内层关联列 payments.order_id 没有可用索引,建议在 payments(order_id) 上建索引」(未验证,api 路径没有 hypopg);第一次跑时 S1 的 EXPLAIN 排在 K3 的 ALTER 后面被语句超时取消,K3 结束后重跑才出结果。slowsql 这次没报对,但是 faultlab 造成的:窗口结束时 faultlab 用取消来停 S1,被取消的执行也记进了 dbe_perf.statement(1 次、1182.85 秒、CPU 0),所以执行历史里出现了 S1。已把 faultlab 改为对慢 SQL 用终止会话,下一轮复验。复验(16:13–16:18,run --codes V7,S1,D):faultlab 改成终止会话后,S1 在窗口结束时「终止了 1 条会话」,dbe_perf.statement 里 S1 那条仍只有上一轮记下的 1 次,这次没再进执行历史。slowsql「历史里不该有 S1」以后的全量跑应能成立。"

  - code: S2
    title: 三层派生表 + LIKE 前缀关联 + 4MB work_mem(按完整编码归集,跑不完)
    signals: 同上一直 active(2026-10-24 那轮取编码前 8 位,1~2 分钟就跑完一次,已改成跑不完);前半段哈希聚合落盘,之后一直在读临时文件
    expect:
      - waitevent: 该窗口 DB time 里 IO 占比上升(DBTIME_IO_HEAVY)
      - memanalyze: 落盘类发现(MEM_SQL_SPILL / MEM_OP_SPILL)
      - sqltune: 应指出 LIKE 前缀关联用不上索引
    actual: "2026-10-24 第二轮(修复后,15:38:04–15:58:04,快照 3185–3190):故障已造出:S2 一直在跑,不再循环跑完(到 15:45 已执行 397 秒,health 报了 SLOWSQL_RUNNING)。sqltune 报对了:根因规则 like_join_pattern 点中「LIKE 的模式取自另一侧的列……customers 上的 idx_customers_code 用不上」。waitevent 五个窗口都没报 DBTIME_IO_HEAVY(DATA_IO_TIME 最高 5.7%),未报。memanalyze 没报 MEM_SQL_SPILL / MEM_OP_SPILL:L4/L5 的前置参数都满足(报告里逐个列出了 enable_resource_track=on、resource_track_level=operator 等),但 openGauss-lite 不填 WLM 作业视图,脚本写的是「这一层看不到」,不再误报「参数没开」。库级落盘由 WDR_TEMP_SPILL(5.86 GB)和 WIN_TEMP_SPILL(5.7 GB)报出。窗口结束时 S2 也被取消,同样进了执行历史(1 次、1174.8 秒),原因同 S1。"

  - code: S3
    title: NOT IN 碰上可空列(逐行子计划)
    signals: 单次执行约 8 分钟,窗口内跑完 1 次以上;dbe_perf.statement 里有它
    expect:
      - slowsql: 应按阈值筛出它(SLOWSQL_TOP)
      - topsql: 平均耗时榜应排前
      - sqltune: 应指出 NOT IN + 可空列不能改写成反连接,建议改 NOT EXISTS
    actual: "2026-10-24 第二轮(修复后,15:38:04–15:58:04,快照 3185–3190):故障已造出:窗口内跑完 1 次,1063 秒。topsql 报对了:--by self_avg(平均自身耗时,不含等待)榜首就是它(sql_id 3509710879,CPU+IO 551 秒);--by avg 被等锁语句和被取消的 S1/S2 占了前两位。slowsql(累计近一周)排第 2。sqltune 报对了:按 sql_id 调优这次成功(上一轮因占位符猜成 'test' 失败),根因规则 not_in_subplan 点中「NOT IN 子查询没有变成反连接……customers.code 有 NULL(null_frac=0.010)」;--sql-stdin 也是同样结论。"

  - code: S4
    title: 索引列上套类型转换(code::bigint)
    signals: 单次约 3 分钟;计划里 Seq Scan on customers + Filter 带 ::bigint
    expect:
      - slowsql: 应筛出
      - sqltune: 应指出转换套在索引列上导致 idx_customers_code 失效
    actual: "2026-10-24 第二轮(修复后,15:38:04–15:58:04,快照 3185–3190):故障已造出:跑完 1 次,394.5 秒。slowsql 筛出来了(sql_id 2643287733,累计榜第 6);topsql --by self_avg 排第 2。sqltune 按 sql_id 报对了:根因规则 cast_on_indexed_column「类型转换 (code)::bigint 套在索引列 customers.code 上……idx_customers_code 用不上」与 correlated_subplan 同时点中;只是 schema 仍按执行账号推测成 fl_app(SQL 里写的是全名,不影响结论)。explain --sql-id 仍拒绝执行(归一化文本带 3 个占位符),这是设计上的边界。"

  - code: S5
    title: 统计信息过期 + 数据倾斜 → 估几行、实际上万行
    signals: "EXPLAIN 里 import_stage 那一行的估计值远小于实际(实际是 cust_id=1 且 id<=cap 的约 cap/3 行,cap 由 calibrate 定);前提是 V7 的自证没写「已被自动 ANALYZE」—— 2026-10-24 那轮就是被自动 ANALYZE 抢先,估算准了,S5 不成立"
    expect:
      - sqltune: 应指出统计信息过期(建议 ANALYZE),而不是只建议加索引
      - health: STALE_STATS 应包含 fl.import_stage
      - memanalyze: 可能报 MEM_SQL_ESTIMATE_OFF(估算偏差)
    actual: "2026-10-24 第二轮(修复后,15:38:04–15:58:04,快照 3185–3190):故障还是没造出来,而且是 faultlab 的问题:import_stage 的列统计(pg_stats 5 列)是今天 09:47 那次自动 ANALYZE 留下的,TRUNCATE 不清列统计,V7 每次导入的又是同分布的数据,所以 EXPLAIN 估 rows=11304,和实际(约 11026)几乎一样,没有错估。新加的表级触发线起作用了,窗口里没有再被自动分析。health 报了 STALE_STATS「fl.import_stage……pg_class.relpages 为 0」;sqltune 的统计新鲜度表把 import_stage 判「不通过」(relpages=0、last_analyze 09:47:28),但根因规则只点了 correlated_subplan(payments 逐行扫描),这时估算其实是准的,不建议 ANALYZE 也合理。S5 到窗口结束跑了 547 秒没跑完,被取消后进了执行历史。已把 V7 改为导入前重建这张表、清掉列统计,下一轮复验。复验(16:13–16:18):V7 改成导入前重建表后,import_stage 的 pg_stats 是 0 行,reltuples/relpages 都是 0;EXPLAIN S5 估 rows=733,实际 cust_id=1 且 id<=33079 有 11026 行,估少约 15 倍,统计过期这个前提已经能造出来。S5 本身的 skill 检验(sqltune 是否建议 ANALYZE、memanalyze 估算偏差)要等下一次全量跑。"

  - code: S6
    title: 四个窗口函数 + 64kB work_mem(落盘)
    signals: "EXPLAIN ANALYZE 里 Sort Method: external merge,单次四个排序各落 77~112 MB"
    expect:
      - memanalyze: MEM_SQL_SPILL / MEM_OP_SPILL
      - waitevent: IO 相关占比上升
    actual: "2026-10-24 第二轮(修复后,15:38:04–15:58:04,快照 3185–3190):故障已造出:跑完 5 次。WDR collect 3185→3190 把它认成溢出冠军:sqlid 2858996927 落盘 4483.64 MiB,占语句级的 99%、库级的 77%,并注明它不在耗时前 10。memanalyze 没报 MEM_SQL_SPILL / MEM_OP_SPILL:L4/L5 视图在,前置参数都满足,但查不到作业记录(openGauss-lite 不填),报告写明「这一层看不到」,并指向 WDR 的落盘指标;L3 的负内存都标了「不可信」。waitevent 第 4 窗口 BufFileRead 70.7 秒、BufFileWrite 37.8 秒排在 IO 事件前列,但 DATA_IO_TIME 只占 5.7%,没出 DBTIME_IO_HEAVY。sqltune 按 sql_id 没有误报根因规则。"

  - code: S7
    title: 高频中等慢 SQL(cust_code 无索引)
    signals: 调用次数远高于其他 SQL,单次 1~3 秒
    expect:
      - topsql: "**总耗时**榜首应是它,而**平均耗时**榜首应是 S3/S4 —— 两张榜不该是同一条"
      - health: SLOWSQL_TOP 或 ACTIVE_SQL_HOT
    actual: "2026-10-24 第二轮(修复后,15:38:04–15:58:04,快照 3185–3190):故障已造出:窗口内 8698 次,单次约 131 ms,合计 1139 秒。topsql 报对了:--by self(自身耗时 = CPU + 数据 IO,不含等待)榜首就是 S7(CPU+IO 585.7 秒),--by self_avg 榜首是 S3、第二是 S4,两张榜不同。--by time 榜首仍是 K1 链上等锁的 UPDATE fl.acct(5964 秒),但表下明确写了「#1、#2… 的耗时有 80% 以上不是 CPU / 数据 IO,是在等……它们是被挡住的,不是自己慢」。WDR 把它列为 CPU 冠军(WDR_TOPSQL_CPU_HEAVY,1139s × 8698 次)。health 的 SLOWSQL_TOP 和 ACTIVE_SQL_HOT 都没点到 S7:平均 131 ms,不过 500 ms 的阈值,未报。"

  # ----------------------------------------------------------------- 锁等待
  - code: K1
    title: 四层行锁阻塞链,根会话空闲不提交
    signals: 5 个会话 waiting;pg_thread_wait_status 里 block_sessionid 成链
    expect:
      - lockwait: LOCK_BLOCKED + LOCK_ROOT_IDLE_XACT;**根阻塞会话必须算到最根上那个
          (fl:K1/root),不能算成链条中间的 mid1/mid2**
      - health: XACT_IDLE(空闲事务)
    actual: "2026-10-24 第二轮(修复后,15:38:04–15:58:04,快照 3185–3190):故障已造出:根是 fl:K1/root,四层链一直保持到窗口结束。lockwait 报对了:每次都把根算到 9011(fl:K1/root),只对根生成 pg_terminate_session;判定码 LOCK_WAIT → LOCK_WAIT_LONG + LOCK_ROOT_IDLE_XACT。锁类型说明改对了:transactionid 写的是「在等持有者的事务结束……不是表锁,8 级表锁矩阵与『典型语句』都不适用」,tuple 写的是「在排队等同一行」。health 报对了:XACT_IDLE(pid … idle in transaction 412s),Long & Idle Transactions 也列出了整条链(上一轮因为 connection_info 过滤一条都没有)。--from/--to 回看也给出了完整链 9016→…→9011(根,idle in transaction,约 1160 秒)。"

  - code: K10
    title: 孤儿两阶段事务
    signals: pg_prepared_xacts 有 fl_orphan_k10;持锁者不在 pg_stat_activity
    expect:
      - health: PREPARED_XACT
      - lockwait: 等它的会话应被识别为「阻塞者不是会话」,建议 ROLLBACK PREPARED
    actual: "2026-10-24 第二轮(修复后,15:38:04–15:58:04,快照 3185–3190):故障已造出:fl_orphan_k10 在 pg_prepared_xacts 里,锁着 acct id=100。health 报了 PREPARED_XACT,vacuum 把它列为 R4 的阻塞源(带 gid)。lockwait 那一条仍无从检验:这一轮也没有会话去等 id=100(K2 已改用 1001~2000 号行),没出现「阻塞者不是会话」的情形,也就没报。要测这一条,场景得自带一个等待者。"

  - code: K4
    title: LOCK TABLE IN EXCLUSIVE MODE,锁 2 分钟放 1 分钟
    signals: 锁着的那几分钟 pg_locks 有 ExclusiveLock,业务侧 2 个会话 waiting
    expect:
      - lockwait: LOCK_WAIT / LOCK_WAIT_LONG,锁对象是 fl.acct_child
    actual: "2026-10-24 第二轮(修复后,15:38:04–15:58:04,快照 3185–3190):故障已造出:锁 2 分钟、放 1 分钟。lockwait 报对了:fl:K4/monthend(LOCK TABLE fl.acct_child IN EXCLUSIVE MODE)是根,3 个会话以 RowExclusiveLock ← ExclusiveLock 等在 relation fl.acct_child 上,已等 75~95 秒。后半段 K4 的 LOCK TABLE 排到了 K6 子表插入后面,回看里的链是 K4 业务会话 → K4 → K6/child → K6/parent(根,idle in transaction),lockwait 如实把根算到了 K6/parent。"

  - code: K6
    title: 外键父子表互等
    signals: 子表插入会话 waiting,等的是父行
    expect:
      - lockwait: 应报出等待,且说明与外键有关
    actual: "2026-10-24 第二轮(修复后,15:38:04–15:58:04,快照 3185–3190):故障已造出:fl:K6/child 在 transactionid 上等 fl:K6/parent(SELECT … FOR UPDATE 锁着父行 id=200),已等 320 秒。lockwait 报出了这一对,根是 K6/parent,kill 语句也是针对它。但仍没有点明这和外键有关。另外,「互斥关系」一节只解释前 5 对(lockwait.py 里的 pairs[:5]),K1 的 5 对把名额占满了,K6 这一对的锁类型说明没显示出来。外键这一点仍未报。"

  - code: K7
    title: 多会话插同一主键
    signals: waiting 的会话等的是 transactionid(不是行锁)
    expect:
      - lockwait: 应报出「在等某笔事务的结果」,而不是「在等某一行」
    actual: "2026-10-24 第二轮(修复后,15:38:04–15:58:04,快照 3185–3190):故障已造出:fl:K7/race0、race1 在 transactionid 上等 fl:K7/first(同键插入 uniq_race k=777)。lockwait 报出了等待对,根是 K7/first,锁对象是 transactionid。不再出现「REFRESH MATERIALIZED VIEW CONCURRENTLY」那句错误说明。但因为互斥关系只解释前 5 对(同 K6),K7 这一对实际会给出什么说明(按代码是「插入同一个主键 / 唯一键」)这一轮没在报告里显示出来,只能算部分验证。"

  - code: K8
    title: 咨询锁(advisory)排队
    signals: pg_locks 里 locktype='advisory',1 持有 3 排队
    expect:
      - lockwait: 应报出 advisory 锁等待 —— **只看表锁的实现会在这里完全漏报**
    actual: "2026-10-24 第二轮(修复后,15:38:04–15:58:04,快照 3185–3190):故障已造出:1 个会话持有咨询锁 880001,3 个排队。lockwait 报对了:advisory 锁对象,根是 fl:K8/holder。回看里根写的是「未采到(采样不记空闲会话,可能是会话级锁如 advisory 锁的持有者)」,如实说明了采样的边界。kill 语句旁仍写「事务已持续 ? 秒」:会话级咨询锁没有事务,这是小瑕疵。"

  - code: K2
    title: 批处理 FOR UPDATE,抖动型等锁(只用 acct 1001~2000 号行)
    signals: 等锁数在 0~2 之间跳;单次等待不超过几秒(2026-10-24 那轮从 1 号行扫起,被 K1 挡成了持续阻塞,已改用别的场景不碰的行)
    expect:
      - lockwait: 瞬时查询可能什么都看不到(正常);WDR 窗口里应有锁等待事件累计
      - waitevent: WAIT_LOCK_HEAVY 或 LOCK_EVENT 占比
    actual: "2026-10-24 第二轮(修复后,15:38:04–15:58:04,快照 3185–3190):故障已造出(上一轮被 K1 挡成了持续阻塞):改用 1001~2000 号行后,8 次连采的等锁数是 2 0 0 0 2 0 0 2,单次等待约 2 秒,是抖动型。lockwait 瞬时查询多半看不到它,这是预期。waitevent 第 1、2 窗口都有 LOCK_EVENT(transactionid / tuple),但主要来自 K1/K4,看不出哪些是 K2 的。--from/--to 回看这次读到了内存里的采样(上一轮误报「回看不了」),但 K2 这种两秒一次的短等待没进阻塞链,未单独报出。"

  - code: K5
    title: 非并发建索引挡住写入(慢表达式索引,整个时段都在建)
    signals: 整个时段 fl:K5/ddl 都在跑 CREATE INDEX(时段结束时被取消,不留索引);写入会话 waiting,锁对象 fl.order_items(2026-10-24 那轮普通索引 7 秒就建完,挡住写入的反而是之后的 DROP INDEX,已改)
    expect:
      - lockwait: 应报出 DDL(建索引)是阻塞者
    actual: "2026-10-24 第二轮(修复后,15:38:04–15:58:04,快照 3185–3190):故障已造出:慢表达式索引 CREATE INDEX 从 15:45:14 起一直在建,两个写入会话全程在等;到排期停时被取消,cleanup 写「索引 … 不存在(那次建索引没建成),不用删」。lockwait 报对了:15:46:43 那次的阻塞明细里,2 个写入会话 RowExclusiveLock ← ShareLock 等在 relation fl.order_items 上,根是 9220,即 fl:K5/ddl,正在执行 CREATE INDEX idx_fl_k5_items_note ON fl.order_items ((fl.fl_slow_key(note, 200)))。--from/--to 回看同样把 9220 的 CREATE INDEX 列为根,挡了 130 秒。"

