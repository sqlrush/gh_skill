  # ----------------------------------------------------------------- 死锁
  - code: D
    title: 六种死锁形态轮流(D1 交叉行、D2 三会话成环、D3 跨表、D4 锁升级、D5 外键、D6 唯一索引)
    signals: pg_stat_database.deadlocks 每 30 秒 +1;时间线里有每一轮的形态与计数增量
    expect:
      - health: DEADLOCKS(应给出累计计数,并说明这个计数不会自己清零)
      - lockwait: LOCK_DEADLOCK
      - 建议内容: 不同形态的建议应有区别(改加锁顺序 / 一开始就 FOR UPDATE / 调整父子表写入顺序)
    actual: "2026-10-24 第二轮(修复后,15:38:04–15:58:04,快照 3185–3190):故障造出来了,但只有 5 种形态:D 驱动报本次新增 21 次;health 时段体检 WIN_DEADLOCK 21 次、WDR_DEADLOCK 21 次,死锁日志里也是 21 条。D5(外键)三轮都是 +0,没撞出死锁:它插的子表 acct_child 正被 K4 的 LOCK TABLE 锁着,插入卡在表锁上,不是外键。这是 faultlab 的问题,已把 D5 改用自己的外键子表,待复验。health 这次报对了:DEADLOCKS「死锁(距上次新增) 9(累计 116)」,下一次「11(累计 127)」,用的是开跑前留下的基线(GSDB_REPORTS_DIR)。lockwait 实时模式没有 LOCK_DEADLOCK,这是预期限制。lockwait --deadlock-log 解析出 21 次、4 种模式:D2 三会话环、D3 跨表(不同语句交叉加行锁)、D6 唯一索引(同键插入)的建议都对;D4 锁升级被并进「2 个事务执行同一条 UPDATE、改行顺序不一致」,建议是按同一顺序改行,而不是「一开始就 FOR UPDATE」——日志里只有两条 UPDATE,看不到前面的 FOR SHARE,仍未区分出来。复验(16:13–16:18):D3/D5 改用自己的外键子表 dl_child 后,六种形态各撞出 1 次死锁(D1~D6 均 +1),D5 不再被 K4 的表锁挡住。"

